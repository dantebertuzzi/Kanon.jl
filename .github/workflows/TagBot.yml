# Cria a tag e a release no GitHub depois que o General aceita uma versão.
#
# Cinco pacotes num repositório só: cada um é registrado com o próprio `subdir`, e cada um
# ganha a própria tag. O núcleo, na raiz, fica com a tag de sempre (`v0.1.0`); as camadas,
# com o nome na frente (`Extenso-v0.1.0`), que é o padrão do TagBot para subdiretório.
name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subdir: ['', 'lib/Extenso', 'lib/KanonScience', 'lib/KanonLegal', 'lib/KanonLSP']
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          subdir: ${{ matrix.subdir }}
