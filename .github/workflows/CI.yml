name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', 'nightly']
        os: [ubuntu-latest]
        include:
          - version: '1'
            os: macOS-latest
          - version: '1'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2

      # O núcleo primeiro, e sozinho: se ele passa aqui, passa sem camada nenhuma
      # carregada — que é o que o teste de neutralidade precisa para valer.
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # A cobertura sai de uma execução só, a do Linux com a versão estável: medir a
          # mesma coisa cinco vezes não acrescenta informação e atrasa o retorno.
          coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.version == '1.11' }}

      # As camadas e a ferramenta, cada uma no ambiente dela, com o núcleo local.
      #
      # Os caminhos vão numa chamada só: `develop` resolve o ambiente inteiro, e fazer
      # o do núcleo antes do de `Extenso` faria o Pkg procurar `Extenso` no registro —
      # onde ele não está, e não vai estar antes da F10.
      - name: Extenso
        run: |
          julia --project=lib/Extenso -e '
            using Pkg; Pkg.develop([PackageSpec(path=".")]); Pkg.instantiate()'
          julia --project=lib/Extenso lib/Extenso/test/runtests.jl
        shell: bash

      - name: KanonLegal
        run: |
          julia --project=lib/KanonLegal -e '
            using Pkg
            Pkg.develop([PackageSpec(path="."), PackageSpec(path="lib/Extenso"),
                         PackageSpec(path="lib/KanonScience")])
            Pkg.instantiate()'
          julia --project=lib/KanonLegal lib/KanonLegal/test/runtests.jl
        shell: bash

      # `Extenso` entra só para a suíte: o pacote não depende dele, e é o teste dos
      # separadores que precisa de um ambiente com idioma para haver o que separar.
      - name: KanonScience
        run: |
          julia --project=lib/KanonScience -e '
            using Pkg
            Pkg.develop([PackageSpec(path="."), PackageSpec(path="lib/Extenso")])
            Pkg.instantiate()'
          julia --project=lib/KanonScience lib/KanonScience/test/runtests.jl
        shell: bash

      - name: KanonLSP
        run: |
          julia --project=lib/KanonLSP -e '
            using Pkg; Pkg.develop([PackageSpec(path=".")]); Pkg.instantiate()'
          julia --project=lib/KanonLSP lib/KanonLSP/test/runtests.jl
        shell: bash

      # A cobertura é sinal fraco neste projeto e vale dizê-lo: nenhum dos defeitos que
      # os cinco modelos reais acharam era linha descoberta — todos estavam na interseção
      # de duas coisas cobertas separadamente. O que ela pega, e que vale, é código que
      # teste nenhum alcança. O sinal forte está na suíte: as invariantes, o teorema da
      # lacuna como propriedade, os goldens byte a byte e o registro de diagnósticos.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.11'
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.11'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
          julia --project=docs docs/make.jl

  neutrality:
    name: Neutrality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # Roda o teste de neutralidade num ambiente onde NENHUMA camada existe. Um teste
      # que precisasse de `Extenso` para provar que `Extenso` não vazou não provaria
      # nada, e este job existe para que essa condição seja verificada pela máquina.
      - name: Core alone
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=. -e '
            using Test, Kanon, Dates
            @testset "neutralidade" begin
              include("test/test_neutralidade.jl")
            end'
