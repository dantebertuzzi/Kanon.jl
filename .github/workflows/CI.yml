name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', 'nightly']
        os: [ubuntu-latest]
        include:
          - version: '1'
            os: macOS-latest
          - version: '1'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2

      # O núcleo primeiro, e sozinho: se ele passa aqui, passa sem camada nenhuma
      # carregada — que é o que o teste de neutralidade precisa para valer.
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # A cobertura sai de uma execução só, a do Linux com a versão estável: medir a
          # mesma coisa cinco vezes não acrescenta informação e atrasa o retorno.
          coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.version == '1.11' }}

      # As camadas e a ferramenta, cada uma no ambiente dela, com o núcleo local.
      #
      # Os caminhos vão numa chamada só: `develop` resolve o ambiente inteiro, e fazer
      # o do núcleo antes do de `Extenso` faria o Pkg procurar `Extenso` no registro —
      # onde ele não está, e não vai estar antes da F10.
      #
      # E é por isso que a suíte de cada camada roda pelo ARQUIVO, e não por `Pkg.test()`:
      # `Pkg.test()` monta um ambiente próprio a partir de `[targets] test` e mandaria o
      # Pkg ao registro atrás das camadas irmãs. A consequência é que as dependências
      # declaradas em `[extras]` **não entram sozinhas** — quem as instala aqui é este
      # arquivo, uma a uma, com o motivo escrito ao lado.
      - name: Extenso
        run: |
          julia --project=lib/Extenso -e '
            using Pkg
            Pkg.develop([PackageSpec(path=".")])
            Pkg.add("Tables")          # só a suíte: é o certificado que gera um por linha
            Pkg.add("JSON3")           # só a suíte: é o atestado que lê o contrato de um JSON
            Pkg.instantiate()'
          julia --project=lib/Extenso lib/Extenso/test/runtests.jl
        shell: bash

      # O pandoc de verdade, na versão em que o golden do `.docx` foi conferido: o modelo
      # real nº 15 é entregue pelo caminho da ajuda da CLI, `kanon render … --to markdown
      # | pandoc -o saida.docx`, e o teste roda essa cadeia num processo novo. Sem ele, o
      # teste recusa rodar no CI em vez de se pular — a porta testada fora do lugar é
      # como a D-070 passou.
      #
      # Do binário da release, e não da `pandoc/actions/setup`: ela instala o pacote
      # x86_64 também no macOS arm64.
      - name: pandoc
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PANDOC_VERSION: '3.11'
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   asset=linux-amd64.tar.gz ;;
            macOS-ARM64) asset=arm64-macOS.zip ;;
            macOS-X64)   asset=x86_64-macOS.zip ;;
            Windows-X64) asset=windows-x86_64.zip ;;
            *) echo "sem pandoc para $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/pandoc"
          mkdir -p "$dir"
          gh release download "$PANDOC_VERSION" --repo jgm/pandoc \
            --pattern "pandoc-$PANDOC_VERSION-$asset" --dir "$dir"
          cd "$dir"
          case "$asset" in
            *.tar.gz) tar xzf "pandoc-$PANDOC_VERSION-$asset" ;;
            *)        unzip -q "pandoc-$PANDOC_VERSION-$asset" ;;
          esac
          bin=$(find "$dir" -type f \( -name pandoc -o -name pandoc.exe \) | head -1)
          if [ "$RUNNER_OS" = Windows ]; then bin=$(cygpath -w "$bin"); fi
          "$bin" --version | head -1
          echo "KANON_PANDOC=$bin" >> "$GITHUB_ENV"

      - name: KanonLegal
        run: |
          julia --project=lib/KanonLegal -e '
            using Pkg
            Pkg.develop([PackageSpec(path="."), PackageSpec(path="lib/Extenso"),
                         PackageSpec(path="lib/KanonScience")])
            Pkg.add("JSON3")           # só a suíte: é a doação que lê os dados de um JSON
            Pkg.instantiate()'
          julia --project=lib/KanonLegal lib/KanonLegal/test/runtests.jl
        shell: bash

      # `Extenso` entra só para a suíte: o pacote não depende dele, e é o teste dos
      # separadores que precisa de um ambiente com idioma para haver o que separar. O
      # `develop` o escreve em `[deps]` aqui dentro — e só aqui: o job `registravel` confere
      # que isso nunca chega ao arquivo commitado.
      - name: KanonScience
        run: |
          julia --project=lib/KanonScience -e '
            using Pkg
            Pkg.develop([PackageSpec(path="."), PackageSpec(path="lib/Extenso")])
            Pkg.add("JSON3")           # só a suíte: é o certificado que lê as medições de um JSON
            Pkg.add(["CSV", "Tables"]) # só a suíte: é a verificação que lê uma planilha de verdade
            Pkg.instantiate()'
          julia --project=lib/KanonScience lib/KanonScience/test/runtests.jl
        shell: bash

      - name: KanonLSP
        run: |
          julia --project=lib/KanonLSP -e '
            using Pkg
            # as camadas entram só para a suíte: é o modelo real nº 13 que as pede
            Pkg.develop([PackageSpec(path="."), PackageSpec(path="lib/Extenso"),
                         PackageSpec(path="lib/KanonScience"), PackageSpec(path="lib/KanonLegal")])
            Pkg.instantiate()'
          julia --project=lib/KanonLSP lib/KanonLSP/test/runtests.jl
        shell: bash

      # A cobertura é sinal fraco neste projeto e vale dizê-lo: nenhum dos defeitos que
      # os cinco modelos reais acharam era linha descoberta — todos estavam na interseção
      # de duas coisas cobertas separadamente. O que ela pega, e que vale, é código que
      # teste nenhum alcança. O sinal forte está na suíte: as invariantes, o teorema da
      # lacuna como propriedade, os goldens byte a byte e o registro de diagnósticos.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.11'
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1.11'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Falha de upload não derruba a suíte: a cobertura é informação sobre o
          # projeto, e não uma das garantias dele. Um serviço de fora fora do ar não
          # pode transformar um commit bom em CI vermelha.
          fail_ci_if_error: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
          julia --project=docs docs/make.jl

      # A landing page (`web/`) mora na **raiz** do `gh-pages`, ao lado do que o
      # Documenter publica em `dev/`, `stable/` e `previews/`. Este passo roda depois do
      # deploy da documentação de propósito: o Documenter reescreve o `index.html` da
      # raiz a cada publicação, e sem isto a landing duraria até o próximo build.
      - name: Landing page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          cp web/index.html web/logo.png site/
          rm -rf site/fonts && cp -r web/fonts site/fonts
          cd site
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html logo.png fonts
          git diff --cached --quiet || git commit -m "Landing page: $GITHUB_SHA"
          git push

  # O `Project.toml` commitado, conferido como o General vai conferir, e **antes** de qualquer
  # `Pkg.develop`: é o passo acima que escreve as camadas irmãs em `[deps]`, e foi uma cópia
  # assim, commitada, que fez a `KanonScience` depender do `Extenso` e a `KanonLegal` da
  # `KanonScience`, sem código nenhum que as usasse. Job próprio, com checkout limpo, para
  # que nenhum outro passo toque os arquivos que ele lê.
  registravel:
    name: Registrable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - run: julia .github/scripts/registravel.jl

  # As provas de fogo: o motor dentro de outra ferramenta. O blog constrói um site em
  # Franklin e planta os erros de um redator; o gerador de minutas monta o formulário do
  # checklist e o preenche num Chrome sem janela — que as imagens do Ubuntu já trazem.
  # Os dois projetos trazem o `Manifest.toml` — reprodutibilidade é metade do propósito —, e
  # por isso rodam na versão de Julia que os resolveu. `[sources]` pede 1.11 ou mais.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - name: Blog em Franklin
        run: |
          julia --project=exemplos/blog -e 'using Pkg; Pkg.instantiate()'
          julia --project=exemplos/blog exemplos/blog/teste.jl
          cd exemplos/blog && julia --project=. construir.jl
      - name: Gerador de minutas
        run: |
          julia --project=exemplos/minutas -e 'using Pkg; Pkg.instantiate()'
          julia --project=exemplos/minutas exemplos/minutas/teste.jl

  neutrality:
    name: Neutrality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # Roda o teste de neutralidade num ambiente onde NENHUMA camada existe. Um teste
      # que precisasse de `Extenso` para provar que `Extenso` não vazou não provaria
      # nada, e este job existe para que essa condição seja verificada pela máquina.
      - name: Core alone
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=. -e '
            using Test, Kanon, Dates
            @testset "neutralidade" begin
              include("test/test_neutralidade.jl")
            end'
